name: Refresh APT package indexes

on:
  push:
    branches: [main]
    paths:
      - 'debs/**'
      - 'icons/**'
      - 'index.html'
      - 'repo-meta.json'
      - '.github/workflows/release.yml'
      - '.github/scripts/build_index.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-indexes
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install index tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev bzip2 xz-utils zstd

      - name: Generate APT indexes
        run: |
          python3 .github/scripts/build_index.py
          bzip2 -9 -k -f Packages
          xz -9 -e -k -f Packages
          zstd --ultra -22 -k -f Packages -o Packages.zst

      - name: Refresh Release checksums
        run: python3 .github/scripts/build_index.py --release-only

      - name: Commit refreshed indexes and naming
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+users.noreply.github.com'
          git add Packages Packages.bz2 Packages.xz Packages.zst Release index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh package indexes and icons'
            # 推送前合并远端最新提交，避免与 App 连续提交竞态
            git pull --rebase origin main || git pull --rebase origin main
            git push
          fi
