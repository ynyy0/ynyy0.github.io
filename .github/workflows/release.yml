name: Refresh APT package indexes

on:
  push:
    branches: [main]
    paths:
      - 'debs/**'
      - 'index.html'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install index tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev bzip2 xz-utils zstd

      - name: Generate APT indexes
        run: |
          dpkg-scanpackages -m debs /dev/null > Packages
          python3 - <<'PY'
          from pathlib import Path

          path = Path('Packages')
          text = path.read_text(encoding='utf-8')
          stanzas = text.rstrip('\n').split('\n\n')
          updated = []
          for stanza in stanzas:
              lines = stanza.splitlines()
              if any(line.startswith('Icon: ') for line in lines):
                  lines = [line for line in lines if not line.startswith('Icon: ')]
              lines.append('Icon: https://ynyy0.github.io/CydiaIcon.png')
              if any(line == 'Package: iya.banana.ios27animation' for line in lines):
                  lines = [
                      'Section: 公益插件' if line.startswith('Section: ') else line
                      for line in lines
                  ]
                  lines = [
                      'Description: 与你有源 / 已公益' if line.startswith('Description: ') else line
                      for line in lines
                  ]
                  if not any(line.startswith('Section: ') for line in lines):
                      lines.append('Section: 公益插件')
              updated.append('\n'.join(lines))
          path.write_text('\n\n'.join(updated) + '\n\n', encoding='utf-8')

          homepage = Path('index.html')
          if homepage.exists():
              html = homepage.read_text(encoding='utf-8')
              html = html.replace('于你有·源', '与你有源')
              homepage.write_text(html, encoding='utf-8')
          PY
          bzip2 -9 -k -f Packages
          xz -9 -e -k -f Packages
          zstd --ultra -22 -k -f Packages -o Packages.zst

      - name: Commit refreshed indexes and naming
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+users.noreply.github.com'
          git add Packages Packages.bz2 Packages.xz Packages.zst index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Add default source icon to package metadata'
            git push
          fi
