<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eaf8f3">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="description" content="于你有源 — iOS 越狱源。复制源地址，或在 Sileo 中添加。">
  <title>于你有源</title>
  <style>
    :root{color-scheme:dark;--page:#101225;--text:#f8f7ff;--muted:#c4c6dc;--card:linear-gradient(135deg,rgba(160,166,220,.105),rgba(47,51,82,.12) 52%,rgba(128,108,177,.075));--edge:rgba(207,211,255,.14);--soft:rgba(255,255,255,.085);--address:rgba(8,10,27,.28);--note:#b0b2ca;--footer:#a0a2bd;--code:#f0eaff}
    *{box-sizing:border-box}
    html{min-height:100%;background:#eaf8f3}
    body{min-height:100vh;min-height:100svh;margin:0;padding:calc(32px + env(safe-area-inset-top)) 20px calc(32px + env(safe-area-inset-bottom));display:grid;place-items:center;overflow-x:hidden;color:var(--text);background:var(--page);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .ambient{position:fixed;z-index:0;inset:0;overflow:hidden;pointer-events:none}.orb{position:absolute;width:min(62vw,520px);aspect-ratio:1;border-radius:50%;filter:blur(2px);opacity:.8}.orb-one{top:-18%;left:-12%;background:radial-gradient(circle at 35% 35%,#c4b5fd 0,#7866ec 23%,transparent 72%)}.orb-two{right:-15%;bottom:-27%;background:radial-gradient(circle at 40% 40%,#8de9df 0,#398bb0 25%,transparent 72%)}.orb-three{top:28%;right:12%;width:min(35vw,270px);background:radial-gradient(circle at 35% 35%,#ffc7e9 0,#bb72cc 24%,transparent 74%)}
    .star-layer{position:fixed;z-index:0;inset:0;overflow:hidden;pointer-events:none;display:none}.star{position:absolute;left:var(--x);top:var(--y);width:var(--size);height:var(--size);border-radius:50%;background:#fff;opacity:.5;animation:star-twinkle var(--duration) var(--delay) ease-in-out infinite alternate;will-change:opacity}body:not(.fresh) .star-layer{display:block}@keyframes star-twinkle{from{opacity:.32}to{opacity:var(--bright)}}
    .snow-layer{position:fixed;z-index:6;inset:0;overflow:hidden;pointer-events:none;display:none}.snow{position:absolute;width:var(--size);height:var(--size);border-radius:50%;background:rgba(255,255,255,.96);opacity:.94}body:not(.fresh) .snow-layer{display:block}
    .theme-toggle{position:fixed;z-index:3;top:calc(22px + env(safe-area-inset-top));right:calc(22px + env(safe-area-inset-right));width:54px;height:54px;padding:0;display:grid;place-items:center;border:1px solid rgba(255,255,255,.3);border-radius:50%;color:#ffd76b;background:rgba(255,255,255,.12);box-shadow:0 8px 24px rgba(0,0,0,.2),inset 0 1px 0 rgba(255,255,255,.2);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);cursor:pointer;line-height:0}.theme-toggle:hover{background:rgba(255,255,255,.18)}.sun-mark{position:relative;width:28px;height:28px;display:block;border-radius:50%;background:repeating-conic-gradient(#ffd76b 0deg 7deg,transparent 7deg 45deg)}.sun-mark:after{content:"";position:absolute;inset:7px;border-radius:50%;background:#ffe895}.moon-mark{display:none;width:25px;height:25px;fill:#efa94b}
    main{position:relative;z-index:1;width:min(100%,680px)}.card{position:relative;overflow:hidden;padding:clamp(28px,7vw,58px);border:1px solid var(--edge);border-radius:32px;background:var(--card);box-shadow:0 30px 90px rgba(0,0,0,.16),inset 0 1px 0 rgba(255,255,255,.055);-webkit-backdrop-filter:blur(32px) saturate(145%);backdrop-filter:blur(32px) saturate(145%)}.card:before{content:"";position:absolute;inset:0 0 auto;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.22),transparent);pointer-events:none}.card:after{content:"";position:absolute;width:240px;height:240px;top:-155px;right:-100px;border-radius:50%;background:rgba(166,151,232,.075);filter:blur(40px);pointer-events:none}
    .eyebrow{display:flex;justify-content:flex-start;align-items:center;gap:9px;color:#d7ceff;font-size:.76rem;font-weight:750;letter-spacing:.15em}.spark{width:8px;height:8px;border-radius:50%;background:#8df0dc;box-shadow:0 0 17px #8df0dc}
    h1{display:flex;align-items:center;justify-content:flex-start;gap:.11em;margin:22px 0 16px;text-align:left;font-size:clamp(2.2rem,8vw,4rem);line-height:1.12;letter-spacing:-.055em}.title-dot{display:inline-block;color:#b8a5ff;font-size:1.22em;line-height:.7;text-shadow:0 0 22px rgba(191,169,255,.8)}
    .intro{max-width:470px;margin:0;color:var(--muted);font-size:1.05rem;line-height:1.8;text-align:left}.actions{display:flex;flex-wrap:wrap;justify-content:flex-start;gap:12px;margin-top:32px}
    .button{min-height:48px;display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:0 19px;border:1px solid rgba(255,255,255,.23);border-radius:15px;color:var(--text);background:var(--soft);box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 8px 24px rgba(0,0,0,.12);font:inherit;font-weight:650;text-decoration:none;cursor:pointer;position:relative;overflow:hidden;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}.button:hover{border-color:rgba(255,255,255,.42);background:rgba(255,255,255,.15)}.button-primary{color:#201735;border-color:rgba(255,255,255,.52);background:linear-gradient(115deg,rgba(229,218,255,.96),rgba(163,239,231,.92));box-shadow:inset 0 1px 0 rgba(255,255,255,.65),0 9px 28px rgba(131,115,220,.25)}.button-primary:hover{background:linear-gradient(115deg,#f0e9ff,#c0f6ee)}
    .address-label{margin:34px 0 10px;color:var(--muted);font-size:.82rem;font-weight:650;letter-spacing:.04em;text-align:left}.address{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 12px 12px 16px;border:1px solid rgba(255,255,255,.17);border-radius:16px;background:var(--address);box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}code{overflow-wrap:anywhere;color:var(--code);font:.95rem ui-monospace,SFMono-Regular,Menlo,monospace}.copy{flex:0 0 auto;min-height:38px;padding:0 13px;border-radius:11px;font-size:.85rem}.note{margin:19px 0 0;color:var(--note);font-size:.87rem;line-height:1.7;text-align:left}footer{padding:18px 8px 0;color:var(--footer);text-align:center;font-size:.78rem}
    #toast{position:fixed;z-index:12;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));padding:11px 16px;border:1px solid rgba(255,255,255,.22);border-radius:13px;background:rgba(35,36,57,.8);color:var(--text);box-shadow:0 12px 34px rgba(0,0,0,.25);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);opacity:0;transform:translate(-50%,10px);pointer-events:none}#toast.show{opacity:1;transform:translate(-50%,0)}
    body.fresh{color-scheme:light;--page:#eaf8f3;--text:#28443e;--muted:#55766d;--card:linear-gradient(135deg,rgba(255,255,255,.76),rgba(255,255,255,.43));--edge:rgba(255,255,255,.82);--soft:rgba(255,255,255,.48);--address:rgba(255,255,255,.48);--note:#668078;--footer:#718b83;--code:#345b50}body.fresh{background:var(--page)}body.fresh .orb-one{background:radial-gradient(circle at 35% 35%,#ffe5ad 0,#ffc877 24%,transparent 72%);filter:blur(2px);opacity:.8}body.fresh .orb-two{background:radial-gradient(circle at 40% 40%,#9de8d1 0,#8bcfc6 25%,transparent 72%);filter:blur(2px);opacity:.8}body.fresh .orb-three{background:radial-gradient(circle at 35% 35%,#ffd4e5 0,#f3a8c9 24%,transparent 74%);filter:blur(2px);opacity:.8}body.fresh .card{background:linear-gradient(135deg,rgba(255,255,255,.76),rgba(255,255,255,.43));border-color:rgba(255,255,255,.82);box-shadow:0 30px 90px rgba(74,132,115,.17),inset 0 1px 0 rgba(255,255,255,.9)}body.fresh .card:after{background:rgba(255,218,154,.4)}body.fresh .eyebrow{color:#588879}body.fresh .title-dot{color:#e89d57;text-shadow:0 0 20px rgba(255,189,111,.65)}body.fresh .button{border-color:rgba(94,147,131,.2);box-shadow:inset 0 1px 0 rgba(255,255,255,.85),0 8px 22px rgba(71,130,113,.1);background:rgba(255,255,255,.48)}body.fresh .button:not(.button-primary){color:#365c51}body.fresh .button-primary{color:#254a40;border-color:rgba(255,255,255,.8);background:linear-gradient(115deg,#fff0c8,#bcebdc)}body.fresh .theme-toggle{color:#e6a638;border-color:rgba(99,151,134,.25);background:#fff9e8;box-shadow:0 6px 18px rgba(68,124,109,.14)}body.fresh .sun-mark{display:none}body.fresh .moon-mark{display:block}body.fresh #toast{color:var(--text);background:rgba(255,255,255,.9);border-color:rgba(94,147,131,.2)}
    .meteor{position:fixed;z-index:8;top:-15vh;left:-30vw;width:250px;height:3px;opacity:0;pointer-events:none;transform:rotate(42deg);transform-origin:left center;background:linear-gradient(90deg,transparent 0%,rgba(160,220,255,.15) 48%,#fff 100%)}.meteor:after{content:"";position:absolute;right:-2px;top:-3px;width:9px;height:9px;border-radius:50%;background:#fff;box-shadow:0 0 8px rgba(189,234,255,.55)}.meteor.go{animation:meteor-flight 1.8s ease-in forwards}@keyframes meteor-flight{0%{opacity:0;translate:0 0}7%{opacity:1}90%{opacity:1}100%{opacity:0;translate:125vw 120vh}}
    .leaf-layer{position:fixed;z-index:6;inset:0;overflow:hidden;pointer-events:none;display:none}body.fresh .leaf-layer{display:block}.leaf{position:absolute;left:-10vw;top:var(--top);width:var(--size);height:calc(var(--size)*.62);border-radius:100% 0 100% 0;background:linear-gradient(135deg,#d9f28a,#76bd69 62%,#438b55);box-shadow:0 2px 8px rgba(57,107,59,.22);opacity:0;transform:rotate(var(--angle));animation:leaf-breeze var(--duration) var(--delay) ease-in-out infinite}.leaf:after{content:"";position:absolute;width:75%;height:1px;left:10%;top:52%;background:rgba(255,255,255,.6);transform:rotate(-18deg);transform-origin:left center}@keyframes leaf-breeze{0%{translate:-8vw 0;rotate:0deg;opacity:0}10%{opacity:.82}50%{translate:55vw 26px;rotate:150deg}90%{opacity:.75}100%{translate:115vw -12px;rotate:330deg;opacity:0}}
    @media(max-width:440px){.theme-toggle{top:calc(14px + env(safe-area-inset-top));right:calc(14px + env(safe-area-inset-right));width:48px;height:48px}.card{padding-top:64px}.address{align-items:stretch;flex-direction:column}.copy{width:100%}.actions .button{flex:1 1 100%}}
    @media(prefers-reduced-motion:reduce){.meteor,.leaf-layer{display:none!important}.star{animation:none!important;opacity:.6}.snow{animation:none!important}}
  </style>
</head>
<body class="fresh">
  <div class="ambient" aria-hidden="true"><div class="orb orb-one"></div><div class="orb orb-two"></div><div class="orb orb-three"></div></div>
  <div class="star-layer" id="star-layer" aria-hidden="true"></div>
  <div class="snow-layer" id="snow-layer" aria-hidden="true"></div>
  <div class="meteor" id="meteor" aria-hidden="true"></div><div class="leaf-layer" id="leaf-layer" aria-hidden="true"></div>
  <button class="theme-toggle" id="theme-toggle" type="button" aria-label="切换液态风格" aria-pressed="true" title="切换液态风格"><span class="sun-mark" aria-hidden="true"></span><svg class="moon-mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.2 15.1A8.8 8.8 0 0 1 8.9 3.8 8.9 8.9 0 1 0 20.2 15.1Z"/></svg></button>
  <main><section class="card" aria-labelledby="title">
    <div class="eyebrow"><span class="spark" aria-hidden="true"></span> iOS PACKAGE SOURCE</div>
    <h1 id="title"><span>于你有</span><span class="title-dot" aria-hidden="true">·</span><span>源</span></h1>
    <p class="intro">欢迎来到我的越狱源。通过 Sileo 添加源地址，发现并管理适用于你的越狱环境的软件包。</p>
    <div class="actions"><a class="button button-primary" href="sileo://source/https://ynyy.xbcxbc.cn/" aria-label="在 Sileo 中添加于你有源"><span aria-hidden="true">＋</span> 添加到 Sileo</a><a class="button" href="https://qm.qq.com/q/r781ixQ16q" target="_blank" rel="noopener noreferrer">加入交流群 <span aria-hidden="true">↗</span></a></div>
    <p class="address-label">越狱源地址</p><div class="address"><code id="source-url">https://ynyy.xbcxbc.cn/</code><button class="button copy" id="copy-button" type="button">复制地址</button></div>
    <p class="note">在兼容的软件包管理器中添加此地址即可。软件包是否可用，取决于源中已发布的兼容软件包。</p>
  </section><footer>于你有源 · 个人越狱源</footer></main>
  <div id="toast" role="status" aria-live="polite"></div>
  <script>
    const themeToggle=document.getElementById('theme-toggle'),copyButton=document.getElementById('copy-button'),toast=document.getElementById('toast'),meteor=document.getElementById('meteor'),leafLayer=document.getElementById('leaf-layer'),starLayer=document.getElementById('star-layer'),snowLayer=document.getElementById('snow-layer');let toastTimer;const reducedMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;let snowStarted=false;let snowFrameId=null;let snowflakes=[];
    function createStars(){for(let i=0;i<76;i++){const star=document.createElement('i');star.className='star';star.style.setProperty('--x',(Math.random()*100)+'%');star.style.setProperty('--y',(Math.random()*100)+'%');star.style.setProperty('--size',(2+Math.random()*2.6)+'px');star.style.setProperty('--duration',(1.8+Math.random()*4.5)+'s');star.style.setProperty('--delay',(-Math.random()*6)+'s');star.style.setProperty('--bright',(0.78+Math.random()*.22));starLayer.appendChild(star)}}
    createStars();
    function clearSnow(){if(!snowStarted)return;snowStarted=false;cancelAnimationFrame(snowFrameId);snowflakes=[];snowLayer.innerHTML=''}
    function startSnow(){
      if(snowStarted || document.body.classList.contains('fresh')) return;
      snowStarted=true;
      const buttons=[...document.querySelectorAll('.button')];
      snowflakes=[];snowLayer.innerHTML='';
      const count=120;
      for(let i=0;i<count;i++){
        const flake=document.createElement('span');flake.className='snow';
        const size=(2.5+Math.random()*5.4)+'px';flake.style.setProperty('--size',size);
        const x=Math.random()*window.innerWidth,y=-20-Math.random()*window.innerHeight;
        flake.style.left=x+'px';flake.style.top=y+'px';flake.style.opacity=(0.75+Math.random()*0.25).toString();
        const state={x,y,size:parseFloat(size),vx:Math.random()*.7-.35,vy:.9+Math.random()*1.2,stuck:false,button:null};
        snowLayer.appendChild(flake);snowflakes.push({el:flake,state});
      }
      function tick(){
        if(!snowStarted)return;
        for(const item of snowflakes){
          const s=item.state;if(s.stuck)continue;
          s.x+=s.vx;s.y+=s.vy;item.el.style.left=s.x+'px';item.el.style.top=s.y+'px';
          if(s.y>window.innerHeight+30){s.x=Math.random()*window.innerWidth;s.y=-20;continue}
          const cx=s.x+s.size/2,cy=s.y+s.size/2;
          for(const btn of buttons){const r=btn.getBoundingClientRect();if(cx>=r.left&&cx<=r.right&&cy>=r.top&&cy<=r.bottom){
            s.stuck=true;s.button=btn;item.el.style.position='absolute';item.el.style.left=(cx-r.left)+'px';item.el.style.top=(cy-r.top)+'px';item.el.style.zIndex='2';item.el.style.opacity='1';btn.appendChild(item.el);break;
          }}
        }
        snowFrameId=requestAnimationFrame(tick);
      }
      snowFrameId=requestAnimationFrame(tick);
    }
    if(!reducedMotion){function launchMeteor(){if(!document.body.classList.contains('fresh')){meteor.classList.remove('go');void meteor.offsetWidth;meteor.classList.add('go')}setTimeout(launchMeteor,6000+Math.random()*6000)}setTimeout(launchMeteor,1800);for(let i=0;i<16;i++){const leaf=document.createElement('i');leaf.className='leaf';leaf.style.setProperty('--top',(Math.random()*92)+'vh');leaf.style.setProperty('--size',(12+Math.random()*14)+'px');leaf.style.setProperty('--duration',(9+Math.random()*11)+'s');leaf.style.setProperty('--delay',(-Math.random()*18)+'s');leaf.style.setProperty('--angle',(Math.random()*360)+'deg');leafLayer.appendChild(leaf)}}
    themeToggle.addEventListener('click',()=>{const fresh=document.body.classList.toggle('fresh');document.documentElement.style.backgroundColor=fresh?'#eaf8f3':'#101225';document.querySelector('meta[name="theme-color"]').content=fresh?'#eaf8f3':'#101225';themeToggle.setAttribute('aria-pressed',String(fresh));themeToggle.setAttribute('aria-label',fresh?'切换液态风格':'切换清新风格');themeToggle.title=fresh?'切换液态风格':'切换清新风格';if(fresh){clearSnow()}else{startSnow()}});
    if(!document.body.classList.contains('fresh')) startSnow();
    copyButton.addEventListener('click',async()=>{const url=document.getElementById('source-url').textContent;try{await navigator.clipboard.writeText(url);toast.textContent='源地址已复制'}catch{const field=document.createElement('textarea');field.value=url;field.style.position='fixed';field.style.opacity='0';document.body.appendChild(field);field.select();const copied=document.execCommand('copy');field.remove();toast.textContent=copied?'源地址已复制':'请长按地址手动复制'}toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),2200)});
  </script>
</body>
