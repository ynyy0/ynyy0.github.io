<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080b18">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="于你有·源 — iOS 越狱软件源。复制源地址，或在 Sileo 中添加。">
  <title>于你有·源</title>
  <style>
    :root{color-scheme:dark;--page:#080b18;--text:#f8f8ff;--muted:#c0c6dc;--card:linear-gradient(135deg,rgba(117,131,197,.12),rgba(22,29,55,.26) 48%,rgba(55,43,99,.13));--edge:rgba(151,177,255,.2);--soft:rgba(255,255,255,.085);--address:rgba(5,9,24,.34);--note:#aab3cd;--footer:#929bb9;--code:#e5eaff}
    *{box-sizing:border-box}
    html{min-height:100%;background:#080b18}
    body{min-height:100vh;min-height:100svh;margin:0;padding:calc(32px + env(safe-area-inset-top)) 20px 32px;display:grid;place-items:center;overflow-x:hidden;color:var(--text);background:radial-gradient(ellipse at 50% 42%,rgba(18,34,72,.25),transparent 58%),linear-gradient(145deg,#080b18 0%,#0b1021 48%,#090b19 100%);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .ambient{position:fixed;inset:0;overflow:hidden;pointer-events:none;isolation:isolate}.ambient:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,8,19,.14),transparent 35%,rgba(5,7,17,.24));pointer-events:none}.orb{position:absolute;width:min(62vw,520px);aspect-ratio:1;border-radius:50%;filter:blur(2px);opacity:.8}.orb-one{top:-18%;left:-12%;background:radial-gradient(circle at 35% 35%,rgba(143,118,255,.72) 0,rgba(83,83,220,.42) 24%,rgba(40,58,139,.12) 48%,transparent 72%);filter:blur(18px);opacity:.72}.orb-two{right:-15%;bottom:-27%;background:radial-gradient(circle at 40% 40%,rgba(69,236,225,.56) 0,rgba(35,145,187,.36) 27%,rgba(25,77,139,.1) 50%,transparent 72%);filter:blur(20px);opacity:.7}.orb-three{top:28%;right:12%;width:min(35vw,270px);background:radial-gradient(circle at 35% 35%,rgba(255,112,207,.5) 0,rgba(166,76,203,.28) 25%,rgba(96,57,166,.08) 49%,transparent 74%);filter:blur(20px);opacity:.62}
    .theme-toggle{position:fixed;z-index:3;top:calc(22px + env(safe-area-inset-top));right:22px;width:54px;height:54px;padding:0;display:grid;place-items:center;border:1px solid rgba(168,185,255,.3);border-radius:50%;color:#ffd76b;background:rgba(17,24,49,.56);box-shadow:0 8px 26px rgba(0,0,0,.24),0 0 22px rgba(102,128,255,.12),inset 0 1px 0 rgba(255,255,255,.18);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);cursor:pointer;line-height:0}.theme-toggle:hover{background:rgba(33,41,75,.72)}.sun-mark{position:relative;width:28px;height:28px;display:block;border-radius:50%;background:repeating-conic-gradient(#ffd76b 0deg 7deg,transparent 7deg 45deg)}.sun-mark:after{content:"";position:absolute;inset:7px;border-radius:50%;background:#ffe895}.moon-mark{display:none;width:25px;height:25px;fill:#efa94b}
    main{position:relative;z-index:1;width:min(100%,680px)}.card{position:relative;overflow:hidden;padding:clamp(28px,7vw,58px);border:1px solid var(--edge);border-radius:32px;background:var(--card);box-shadow:0 30px 90px rgba(0,0,0,.32),0 0 52px rgba(70,105,225,.09),inset 0 1px 0 rgba(224,233,255,.12);-webkit-backdrop-filter:blur(34px) saturate(155%);backdrop-filter:blur(34px) saturate(155%)}.card:before{content:"";position:absolute;inset:0 0 auto;height:1px;background:linear-gradient(90deg,transparent,rgba(147,182,255,.42),rgba(255,255,255,.26),rgba(150,120,255,.3),transparent);pointer-events:none}.card:after{content:"";position:absolute;width:260px;height:260px;top:-175px;right:-110px;border-radius:50%;background:rgba(88,121,255,.16);filter:blur(42px);pointer-events:none}
    .eyebrow{display:flex;justify-content:flex-start;align-items:center;gap:9px;color:#cbd2ff;font-size:.76rem;font-weight:750;letter-spacing:.15em}.spark{width:8px;height:8px;border-radius:50%;background:#72f5e4;box-shadow:0 0 10px rgba(114,245,228,.95),0 0 23px rgba(70,230,220,.62)}
    h1{display:flex;align-items:center;justify-content:flex-start;gap:.11em;margin:22px 0 16px;text-align:left;font-size:clamp(2.2rem,8vw,4rem);line-height:1.12;letter-spacing:-.055em}.title-dot{display:inline-block;color:#b8a5ff;font-size:1.22em;line-height:.7;text-shadow:0 0 22px rgba(160,139,255,.72)}
    .intro{max-width:470px;margin:0;color:var(--muted);font-size:1.05rem;line-height:1.8;text-align:left}.actions{display:flex;flex-wrap:wrap;justify-content:flex-start;gap:12px;margin-top:32px}
    .button{min-height:48px;display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:0 19px;border:1px solid rgba(170,190,255,.22);border-radius:15px;color:var(--text);background:rgba(31,40,70,.46);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 8px 24px rgba(0,0,0,.16);font:inherit;font-weight:650;text-decoration:none;cursor:pointer;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}.button:hover{border-color:rgba(129,224,255,.48);background:rgba(41,57,91,.62);box-shadow:0 0 22px rgba(68,176,255,.1),inset 0 1px 0 rgba(255,255,255,.18)}.button-primary{color:#10162c;border-color:rgba(215,225,255,.64);background:linear-gradient(115deg,#c8c0ff,#8ce8e7);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 8px 28px rgba(104,124,255,.23),0 0 24px rgba(89,210,239,.12)}.button-primary:hover{background:linear-gradient(115deg,#ddd7ff,#aff5ed)}
    .address-label{margin:34px 0 10px;color:var(--muted);font-size:.82rem;font-weight:650;letter-spacing:.04em;text-align:left}.address{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 12px 12px 16px;border:1px solid rgba(155,180,255,.16);border-radius:16px;background:var(--address);box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}code{overflow-wrap:anywhere;color:var(--code);font:.95rem ui-monospace,SFMono-Regular,Menlo,monospace}.copy{flex:0 0 auto;min-height:38px;padding:0 13px;border-radius:11px;font-size:.85rem}.note{margin:19px 0 0;color:var(--note);font-size:.87rem;line-height:1.7;text-align:left}footer{padding:18px 8px 0;color:var(--footer);text-align:center;font-size:.78rem}
    #toast{position:fixed;z-index:12;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));padding:11px 16px;border:1px solid rgba(255,255,255,.22);border-radius:13px;background:rgba(19,24,46,.86);color:var(--text);box-shadow:0 12px 34px rgba(0,0,0,.25);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);opacity:0;transform:translate(-50%,10px);pointer-events:none}#toast.show{opacity:1;transform:translate(-50%,0)}
    body.fresh{color-scheme:light;--page:#eaf8f3;--text:#28443e;--muted:#55766d;--card:linear-gradient(135deg,rgba(255,255,255,.76),rgba(255,255,255,.43));--edge:rgba(255,255,255,.82);--soft:rgba(255,255,255,.48);--address:rgba(255,255,255,.48);--note:#668078;--footer:#718b83;--code:#345b50}body.fresh{background:var(--page)}body.fresh .orb-one{background:radial-gradient(circle at 35% 35%,#ffe5ad 0,#ffc877 24%,transparent 72%);filter:blur(2px);opacity:.8}body.fresh .orb-two{background:radial-gradient(circle at 40% 40%,#9de8d1 0,#8bcfc6 25%,transparent 72%);filter:blur(2px);opacity:.8}body.fresh .orb-three{background:radial-gradient(circle at 35% 35%,#ffd4e5 0,#f3a8c9 24%,transparent 74%);filter:blur(2px);opacity:.8}body.fresh .ambient:after{display:none}body.fresh .card{background:linear-gradient(135deg,rgba(255,255,255,.76),rgba(255,255,255,.43));border-color:rgba(255,255,255,.82);box-shadow:0 30px 90px rgba(74,132,115,.17),inset 0 1px 0 rgba(255,255,255,.9)}body.fresh .card:after{background:rgba(255,218,154,.4)}body.fresh .eyebrow{color:#588879}body.fresh .title-dot{color:#e89d57;text-shadow:0 0 20px rgba(255,189,111,.65)}body.fresh .button{border-color:rgba(94,147,131,.2);box-shadow:inset 0 1px 0 rgba(255,255,255,.85),0 8px 22px rgba(71,130,113,.1);background:rgba(255,255,255,.48)}body.fresh .button:not(.button-primary){color:#365c51}body.fresh .button-primary{color:#254a40;border-color:rgba(255,255,255,.8);background:linear-gradient(115deg,#fff0c8,#bcebdc)}body.fresh .theme-toggle{color:#e6a638;border-color:rgba(99,151,134,.25);background:#fff9e8;box-shadow:0 6px 18px rgba(68,124,109,.14)}body.fresh .sun-mark{display:none}body.fresh .moon-mark{display:block}body.fresh #toast{color:var(--text);background:rgba(255,255,255,.9);border-color:rgba(94,147,131,.2)}
    .leaf-layer{position:fixed;z-index:6;inset:0;overflow:hidden;pointer-events:none;display:none}body.fresh .leaf-layer{display:block}.leaf{position:absolute;left:-10vw;top:var(--top);width:var(--size);height:calc(var(--size)*.62);border-radius:100% 0 100% 0;background:linear-gradient(135deg,#d9f28a,#76bd69 62%,#438b55);box-shadow:0 2px 8px rgba(57,107,59,.22);opacity:0;transform:rotate(var(--angle));animation:leaf-breeze var(--duration) var(--delay) ease-in-out infinite}.leaf:after{content:"";position:absolute;width:75%;height:1px;left:10%;top:52%;background:rgba(255,255,255,.6);transform:rotate(-18deg);transform-origin:left center}@keyframes leaf-breeze{0%{translate:-8vw 0;rotate:0deg;opacity:0}10%{opacity:.82}50%{translate:55vw 26px;rotate:150deg}90%{opacity:.75}100%{translate:115vw -12px;rotate:330deg;opacity:0}}
    @media(max-width:440px){.theme-toggle{top:calc(14px + env(safe-area-inset-top));right:14px;width:48px;height:48px}.card{padding-top:64px}.address{align-items:stretch;flex-direction:column}.copy{width:100%}.actions .button{flex:1 1 100%}}
    @media(prefers-reduced-motion:reduce){.leaf-layer{display:none!important}}
  </style>
</head>
<body>
  <div class="ambient" aria-hidden="true"><div class="orb orb-one"></div><div class="orb orb-two"></div><div class="orb orb-three"></div></div>
  <div class="leaf-layer" id="leaf-layer" aria-hidden="true"></div>
  <button class="theme-toggle" id="theme-toggle" type="button" aria-label="切换清新主题" aria-pressed="false" title="切换清新主题"><span class="sun-mark" aria-hidden="true"></span><svg class="moon-mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.2 15.1A8.8 8.8 0 0 1 8.9 3.8 8.9 8.9 0 1 0 20.2 15.1Z"/></svg></button>
  <main><section class="card" aria-labelledby="title">
    <div class="eyebrow"><span class="spark" aria-hidden="true"></span> iOS PACKAGE SOURCE</div>
    <h1 id="title"><span>于你有</span><span class="title-dot" aria-hidden="true">·</span><span>源</span></h1>
    <p class="intro">欢迎来到我的软件源。通过 Sileo 添加源地址，发现并管理适用于你的越狱环境的软件包。</p>
    <div class="actions"><a class="button button-primary" href="sileo://source/https://ynyy0.github.io/" aria-label="在 Sileo 中添加于你有源"><span aria-hidden="true">＋</span> 添加到 Sileo</a><a class="button" href="https://qm.qq.com/q/r781ixQ16q" target="_blank" rel="noopener noreferrer">加入交流群 <span aria-hidden="true">↗</span></a></div>
    <p class="address-label">软件源地址</p><div class="address"><code id="source-url">https://ynyy0.github.io/</code><button class="button copy" id="copy-button" type="button">复制地址</button></div>
    <p class="note">在兼容的软件包管理器中添加此地址即可。软件包是否可用，取决于源中已发布的兼容软件包。</p>
  </section><footer>于你有·源 · 个人软件源</footer></main>
  <div id="toast" role="status" aria-live="polite"></div>
  <script>
    const themeToggle=document.getElementById('theme-toggle'),copyButton=document.getElementById('copy-button'),toast=document.getElementById('toast'),leafLayer=document.getElementById('leaf-layer');let toastTimer;const reducedMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
    if(!reducedMotion){for(let i=0;i<16;i++){const leaf=document.createElement('i');leaf.className='leaf';leaf.style.setProperty('--top',(Math.random()*92)+'vh');leaf.style.setProperty('--size',(12+Math.random()*14)+'px');leaf.style.setProperty('--duration',(9+Math.random()*11)+'s');leaf.style.setProperty('--delay',(-Math.random()*18)+'s');leaf.style.setProperty('--angle',(Math.random()*360)+'deg');leafLayer.appendChild(leaf)}}
    themeToggle.addEventListener('click',()=>{const fresh=document.body.classList.toggle('fresh');document.documentElement.style.backgroundColor=fresh?'#eaf8f3':'#080b18';document.querySelector('meta[name="theme-color"]').content=fresh?'#eaf8f3':'#080b18';themeToggle.setAttribute('aria-pressed',String(fresh));themeToggle.setAttribute('aria-label',fresh?'切换回玻璃液态深色主题':'切换清新主题');themeToggle.title=fresh?'切换回玻璃液态深色主题':'切换清新主题'});
    copyButton.addEventListener('click',async()=>{const url=document.getElementById('source-url').textContent;try{await navigator.clipboard.writeText(url);toast.textContent='源地址已复制'}catch{const field=document.createElement('textarea');field.value=url;field.style.position='fixed';field.style.opacity='0';document.body.appendChild(field);field.select();const copied=document.execCommand('copy');field.remove();toast.textContent=copied?'源地址已复制':'请长按地址手动复制'}toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),2200)});
  </script>
</body>
</html>
