<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101225">
  <meta name="description" content="于你有·源 — iOS 越狱软件源。复制源地址，或在 Sileo 中添加。">
  <title>于你有·源</title>
  <style>
    :root{color-scheme:dark;--page:#101225;--text:#f8f7ff;--muted:#c4c6dc;--card:linear-gradient(135deg,rgba(255,255,255,.17),rgba(255,255,255,.045) 52%,rgba(255,255,255,.085));--edge:rgba(255,255,255,.25);--soft:rgba(255,255,255,.085);--address:rgba(8,10,27,.28);--note:#b0b2ca;--footer:#a0a2bd;--code:#f0eaff}
    *{box-sizing:border-box}
    body{min-height:100vh;margin:0;padding:32px 20px;display:grid;place-items:center;overflow-x:hidden;color:var(--text);background:var(--page);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .ambient{position:fixed;inset:0;overflow:hidden;pointer-events:none}.orb{position:absolute;width:min(62vw,520px);aspect-ratio:1;border-radius:50%;filter:blur(2px);opacity:.8}.orb-one{top:-18%;left:-12%;background:radial-gradient(circle at 35% 35%,#c4b5fd 0,#7866ec 23%,transparent 72%)}.orb-two{right:-15%;bottom:-27%;background:radial-gradient(circle at 40% 40%,#8de9df 0,#398bb0 25%,transparent 72%)}.orb-three{top:28%;right:12%;width:min(35vw,270px);background:radial-gradient(circle at 35% 35%,#ffc7e9 0,#bb72cc 24%,transparent 74%)}
    .theme-toggle{position:fixed;z-index:3;top:22px;right:22px;width:54px;height:54px;padding:0;display:grid;place-items:center;border:1px solid rgba(255,255,255,.3);border-radius:50%;color:#ffd76b;background:rgba(255,255,255,.12);box-shadow:0 8px 24px rgba(0,0,0,.2),inset 0 1px 0 rgba(255,255,255,.2);cursor:pointer;line-height:0}.theme-toggle:hover{background:rgba(255,255,255,.18)}.sun-mark{position:relative;width:28px;height:28px;display:block;border-radius:50%;background:repeating-conic-gradient(#ffd76b 0deg 7deg,transparent 7deg 45deg)}.sun-mark:after{content:"";position:absolute;inset:7px;border-radius:50%;background:#ffe895}.moon-mark{display:none;width:25px;height:25px;fill:#efa94b}
    main{position:relative;z-index:1;width:min(100%,680px)}.card{position:relative;overflow:hidden;padding:clamp(28px,7vw,58px);border:1px solid var(--edge);border-radius:32px;background:var(--card);box-shadow:0 30px 100px rgba(0,0,0,.38),inset 0 1px 0 rgba(255,255,255,.22);-webkit-backdrop-filter:blur(28px) saturate(155%);backdrop-filter:blur(28px) saturate(155%)}.card:before{content:"";position:absolute;inset:0 0 auto;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.7),transparent);pointer-events:none}.card:after{content:"";position:absolute;width:240px;height:240px;top:-155px;right:-100px;border-radius:50%;background:rgba(198,187,255,.28);filter:blur(34px);pointer-events:none}
    .eyebrow{display:flex;justify-content:flex-start;align-items:center;gap:9px;color:#d7ceff;font-size:.76rem;font-weight:750;letter-spacing:.15em}.spark{width:8px;height:8px;border-radius:50%;background:#8df0dc;box-shadow:0 0 17px #8df0dc}
    h1{display:flex;align-items:center;justify-content:flex-start;gap:.11em;margin:22px 0 16px;text-align:left;font-size:clamp(2.2rem,8vw,4rem);line-height:1.12;letter-spacing:-.055em}.title-dot{display:inline-block;color:#b8a5ff;font-size:1.22em;line-height:.7;text-shadow:0 0 22px rgba(191,169,255,.8)}
    .intro{max-width:470px;margin:0;color:var(--muted);font-size:1.05rem;line-height:1.8;text-align:left}.actions{display:flex;flex-wrap:wrap;justify-content:flex-start;gap:12px;margin-top:32px}
    .button{min-height:48px;display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:0 19px;border:1px solid rgba(255,255,255,.23);border-radius:15px;color:var(--text);background:var(--soft);box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 8px 24px rgba(0,0,0,.12);font:inherit;font-weight:650;text-decoration:none;cursor:pointer;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}.button:hover{border-color:rgba(255,255,255,.42);background:rgba(255,255,255,.15)}.button-primary{color:#201735;border-color:rgba(255,255,255,.52);background:linear-gradient(115deg,rgba(229,218,255,.96),rgba(163,239,231,.92));box-shadow:inset 0 1px 0 rgba(255,255,255,.65),0 9px 28px rgba(131,115,220,.25)}.button-primary:hover{background:linear-gradient(115deg,#f0e9ff,#c0f6ee)}
    .address-label{margin:34px 0 10px;color:var(--muted);font-size:.82rem;font-weight:650;letter-spacing:.04em;text-align:left}.address{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 12px 12px 16px;border:1px solid rgba(255,255,255,.17);border-radius:16px;background:var(--address);box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}code{overflow-wrap:anywhere;color:var(--code);font:.95rem ui-monospace,SFMono-Regular,Menlo,monospace}.copy{flex:0 0 auto;min-height:38px;padding:0 13px;border-radius:11px;font-size:.85rem}.note{margin:19px 0 0;color:var(--note);font-size:.87rem;line-height:1.7;text-align:left}footer{padding:18px 8px 0;color:var(--footer);text-align:center;font-size:.78rem}
    #toast{position:fixed;z-index:12;left:50%;bottom:24px;padding:11px 16px;border:1px solid rgba(255,255,255,.22);border-radius:13px;background:rgba(35,36,57,.8);color:var(--text);box-shadow:0 12px 34px rgba(0,0,0,.25);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);opacity:0;transform:translate(-50%,10px);pointer-events:none}#toast.show{opacity:1;transform:translate(-50%,0)}
    body.fresh{color-scheme:light;--page:#eaf8f3;--text:#28443e;--muted:#55766d;--card:linear-gradient(135deg,rgba(255,255,255,.76),rgba(255,255,255,.43));--edge:rgba(255,255,255,.82);--soft:rgba(255,255,255,.48);--address:rgba(255,255,255,.48);--note:#668078;--footer:#718b83;--code:#345b50}body.fresh .orb-one{background:radial-gradient(circle at 35% 35%,#ffe5ad 0,#ffc877 24%,transparent 72%)}body.fresh .orb-two{background:radial-gradient(circle at 40% 40%,#9de8d1 0,#8bcfc6 25%,transparent 72%)}body.fresh .orb-three{background:radial-gradient(circle at 35% 35%,#ffd4e5 0,#f3a8c9 24%,transparent 74%)}body.fresh .card{box-shadow:0 30px 90px rgba(74,132,115,.17),inset 0 1px 0 rgba(255,255,255,.9)}body.fresh .card:after{background:rgba(255,218,154,.4)}body.fresh .eyebrow{color:#588879}body.fresh .title-dot{color:#e89d57;text-shadow:0 0 20px rgba(255,189,111,.65)}body.fresh .button{border-color:rgba(94,147,131,.2);box-shadow:inset 0 1px 0 rgba(255,255,255,.85),0 8px 22px rgba(71,130,113,.1)}body.fresh .button:not(.button-primary){color:#365c51}body.fresh .button-primary{color:#254a40;border-color:rgba(255,255,255,.8);background:linear-gradient(115deg,#fff0c8,#bcebdc)}body.fresh .theme-toggle{color:#e6a638;border-color:rgba(99,151,134,.25);background:#fff9e8;box-shadow:0 6px 18px rgba(68,124,109,.14)}body.fresh .sun-mark{display:none}body.fresh .moon-mark{display:block}body.fresh #toast{color:var(--text);background:rgba(255,255,255,.9);border-color:rgba(94,147,131,.2)}
    .meteor{position:fixed;z-index:8;top:-15vh;left:-30vw;width:250px;height:3px;opacity:0;pointer-events:none;transform:rotate(42deg);transform-origin:left center;background:linear-gradient(90deg,transparent 0%,rgba(160,220,255,.15) 48%,#fff 100%);filter:drop-shadow(0 0 5px #8edaff) drop-shadow(0 0 14px #fff)}.meteor:after{content:"";position:absolute;right:-2px;top:-3px;width:9px;height:9px;border-radius:50%;background:#fff;box-shadow:0 0 9px 4px #bdeaff,0 0 24px 10px rgba(120,210,255,.9)}.meteor.go{animation:meteor-flight 1.8s ease-in forwards,meteor-flicker .22s ease-in-out 4 alternate}@keyframes meteor-flight{0%{opacity:0;translate:0 0}7%{opacity:1}90%{opacity:1}100%{opacity:0;translate:125vw 120vh}}@keyframes meteor-flicker{from{filter:drop-shadow(0 0 4px #8edaff) drop-shadow(0 0 10px #fff);opacity:.72}to{filter:drop-shadow(0 0 10px #8edaff) drop-shadow(0 0 26px #fff);opacity:1}}
    .leaf-layer{position:fixed;z-index:6;inset:0;overflow:hidden;pointer-events:none;display:none}body.fresh .leaf-layer{display:block}.leaf{position:absolute;left:-10vw;top:var(--top);width:var(--size);height:calc(var(--size)*.62);border-radius:100% 0 100% 0;background:linear-gradient(135deg,#d9f28a,#76bd69 62%,#438b55);box-shadow:0 2px 8px rgba(57,107,59,.22);opacity:0;transform:rotate(var(--angle));animation:leaf-breeze var(--duration) var(--delay) ease-in-out infinite}.leaf:after{content:"";position:absolute;width:75%;height:1px;left:10%;top:52%;background:rgba(255,255,255,.6);transform:rotate(-18deg);transform-origin:left center}@keyframes leaf-breeze{0%{translate:-8vw 0;rotate:0deg;opacity:0}10%{opacity:.82}50%{translate:55vw 26px;rotate:150deg}90%{opacity:.75}100%{translate:115vw -12px;rotate:330deg;opacity:0}}
    body.fresh .meteor{display:none}
    @media(max-width:440px){.theme-toggle{top:14px;right:14px;width:48px;height:48px}.card{padding-top:64px}.address{align-items:stretch;flex-direction:column}.copy{width:100%}.actions .button{flex:1 1 100%}}
    @media(prefers-reduced-motion:reduce){.meteor,.leaf-layer{display:none!important}}
  </style>
</head>
<body>
  <div class="ambient" aria-hidden="true"><div class="orb orb-one"></div><div class="orb orb-two"></div><div class="orb orb-three"></div></div>
  <div class="meteor" id="meteor" aria-hidden="true"></div><div class="leaf-layer" id="leaf-layer" aria-hidden="true"></div>
  <button class="theme-toggle" id="theme-toggle" type="button" aria-label="切换清新主题" aria-pressed="false" title="切换清新主题"><span class="sun-mark" aria-hidden="true"></span><svg class="moon-mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.2 15.1A8.8 8.8 0 0 1 8.9 3.8 8.9 8.9 0 1 0 20.2 15.1Z"/></svg></button>
  <main><section class="card" aria-labelledby="title">
    <div class="eyebrow"><span class="spark" aria-hidden="true"></span> iOS PACKAGE SOURCE</div>
    <h1 id="title"><span>于你有</span><span class="title-dot" aria-hidden="true">·</span><span>源</span></h1>
    <p class="intro">欢迎来到我的软件源。通过 Sileo 添加源地址，发现并管理适用于你的越狱环境的软件包。</p>
    <div class="actions"><a class="button button-primary" href="sileo://source/https://ynyy0.github.io/" aria-label="在 Sileo 中添加于你有源"><span aria-hidden="true">＋</span> 添加到 Sileo</a><a class="button" href="https://qm.qq.com/q/r781ixQ16q" target="_blank" rel="noopener noreferrer">加入交流群 <span aria-hidden="true">↗</span></a></div>
    <p class="address-label">软件源地址</p><div class="address"><code id="source-url">https://ynyy0.github.io/</code><button class="button copy" id="copy-button" type="button">复制地址</button></div>
    <p class="note">在兼容的软件包管理器中添加此地址即可。软件包是否可用，取决于源中已发布的兼容软件包。</p>
  </section><footer>于你有·源 · 个人软件源</footer></main>
  <div id="toast" role="status" aria-live="polite"></div>
  <script>
    const themeToggle=document.getElementById('theme-toggle'),copyButton=document.getElementById('copy-button'),toast=document.getElementById('toast'),meteor=document.getElementById('meteor'),leafLayer=document.getElementById('leaf-layer');
    let toastTimer;const reducedMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
    if(!reducedMotion){
      function launchMeteor(){if(!document.body.classList.contains('fresh')){meteor.classList.remove('go');void meteor.offsetWidth;meteor.classList.add('go')}setTimeout(launchMeteor,6000+Math.random()*6000)}
      setTimeout(launchMeteor,1800);
      for(let i=0;i<16;i++){const leaf=document.createElement('i');leaf.className='leaf';leaf.style.setProperty('--top',(Math.random()*92)+'vh');leaf.style.setProperty('--size',(12+Math.random()*14)+'px');leaf.style.setProperty('--duration',(9+Math.random()*11)+'s');leaf.style.setProperty('--delay',(-Math.random()*18)+'s');leaf.style.setProperty('--angle',(Math.random()*360)+'deg');leafLayer.appendChild(leaf)}
    }
    themeToggle.addEventListener('click',()=>{const fresh=document.body.classList.toggle('fresh');themeToggle.setAttribute('aria-pressed',String(fresh));themeToggle.setAttribute('aria-label',fresh?'切换回玻璃液态深色主题':'切换清新主题');themeToggle.title=fresh?'切换回玻璃液态深色主题':'切换清新主题';document.querySelector('meta[name="theme-color"]').content=fresh?'#eaf8f3':'#101225'});
    copyButton.addEventListener('click',async()=>{const url=document.getElementById('source-url').textContent;try{await navigator.clipboard.writeText(url);toast.textContent='源地址已复制'}catch{const field=document.createElement('textarea');field.value=url;field.style.position='fixed';field.style.opacity='0';document.body.appendChild(field);field.select();const copied=document.execCommand('copy');field.remove();toast.textContent=copied?'源地址已复制':'请长按地址手动复制'}toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),2200)});
  </script>
</body>
</html>
