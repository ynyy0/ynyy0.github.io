<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101225">
  <meta name="description" content="于你有源 — iOS 越狱软件源。复制源地址，或在 Sileo 中添加。">
  <title>ㅤㅤㅤㅤㅤㅤㅤㅤ于你有源</title>
  <style>
    :root {
      color-scheme: dark;
      --text: #f8f7ff;
      --muted: #c4c6dc;
      --glass: rgba(255,255,255,.105);
      --edge: rgba(255,255,255,.25);
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      padding: 32px 20px;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      color: var(--text);
      background: #101225;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .ambient { position: fixed; inset: 0; overflow: hidden; pointer-events: none; }
    .orb { position: absolute; width: min(62vw, 520px); aspect-ratio: 1; border-radius: 50%; filter: blur(2px); opacity: .8; animation: drift 16s ease-in-out infinite alternate; }
    .orb-one { top: -18%; left: -12%; background: radial-gradient(circle at 35% 35%, #c4b5fd 0, #7866ec 23%, rgba(120,102,236,.05) 68%, transparent 72%); }
    .orb-two { right: -15%; bottom: -27%; background: radial-gradient(circle at 40% 40%, #8de9df 0, #398bb0 25%, rgba(57,139,176,.04) 68%, transparent 72%); animation-delay: -7s; }
    .orb-three { top: 28%; right: 12%; width: min(35vw, 270px); background: radial-gradient(circle at 35% 35%, #ffc7e9 0, #bb72cc 24%, rgba(187,114,204,.04) 70%, transparent 74%); animation-delay: -3s; }
    @keyframes drift { to { transform: translate3d(22px, -28px, 0) scale(1.06); } }
    main { position: relative; z-index: 1; width: min(100%, 680px); }
    .card {
      position: relative;
      overflow: hidden;
      padding: clamp(28px, 7vw, 58px);
      border: 1px solid var(--edge);
      border-radius: 32px;
      background: linear-gradient(135deg, rgba(255,255,255,.17), rgba(255,255,255,.045) 52%, rgba(255,255,255,.085));
      box-shadow: 0 30px 100px rgba(0,0,0,.38), inset 0 1px 0 rgba(255,255,255,.22);
      -webkit-backdrop-filter: blur(28px) saturate(155%);
      backdrop-filter: blur(28px) saturate(155%);
    }
    .card::before {
      content: "";
      position: absolute;
      inset: 0 0 auto;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.7), transparent);
      pointer-events: none;
    }
    .card::after {
      content: "";
      position: absolute;
      width: 240px;
      height: 240px;
      top: -155px;
      right: -100px;
      border-radius: 50%;
      background: rgba(198,187,255,.28);
      filter: blur(34px);
      pointer-events: none;
    }
    .eyebrow { display: inline-flex; align-items: center; gap: 9px; color: #d7ceff; font-size: .76rem; font-weight: 750; letter-spacing: .15em; }
    .spark { width: 8px; height: 8px; border-radius: 50%; background: #8df0dc; box-shadow: 0 0 17px #8df0dc; }
    h1 { margin: 22px 0 12px; font-size: clamp(2.2rem, 8vw, 4rem); line-height: 1.12; letter-spacing: -.055em; text-shadow: 0 4px 24px rgba(15,10,40,.22); }
    .intro { max-width: 470px; margin: 0; color: var(--muted); font-size: 1.05rem; line-height: 1.8; }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 32px; }
    .button {
      min-height: 48px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 0 19px;
      border: 1px solid rgba(255,255,255,.23);
      border-radius: 15px;
      color: var(--text);
      background: rgba(255,255,255,.085);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.16), 0 8px 24px rgba(0,0,0,.12);
      font: inherit;
      font-weight: 650;
      text-decoration: none;
      cursor: pointer;
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
      transition: transform .2s ease, background .2s ease, border-color .2s ease;
    }
    .button:hover { transform: translateY(-2px); border-color: rgba(255,255,255,.42); background: rgba(255,255,255,.15); }
    .button-primary { color: #201735; border-color: rgba(255,255,255,.52); background: linear-gradient(115deg, rgba(229,218,255,.96), rgba(163,239,231,.92)); box-shadow: inset 0 1px 0 rgba(255,255,255,.65), 0 9px 28px rgba(131,115,220,.25); }
    .button-primary:hover { background: linear-gradient(115deg, #f0e9ff, #c0f6ee); }
    .address-label { margin: 34px 0 10px; color: var(--muted); font-size: .82rem; font-weight: 650; letter-spacing: .04em; }
    .address { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 12px 12px 16px; border: 1px solid rgba(255,255,255,.17); border-radius: 16px; background: rgba(8,10,27,.28); box-shadow: inset 0 1px 0 rgba(255,255,255,.08); }
    code { overflow-wrap: anywhere; color: #f0eaff; font: .95rem ui-monospace, SFMono-Regular, Menlo, monospace; }
    .copy { flex: 0 0 auto; min-height: 38px; padding: 0 13px; border-radius: 11px; font-size: .85rem; }
    .note { margin: 19px 0 0; color: #b0b2ca; font-size: .87rem; line-height: 1.7; }
    footer { padding: 18px 8px 0; color: #a0a2bd; text-align: center; font-size: .78rem; }
    #toast { position: fixed; z-index: 2; left: 50%; bottom: 24px; padding: 11px 16px; border: 1px solid rgba(255,255,255,.22); border-radius: 13px; background: rgba(35,36,57,.8); color: var(--text); box-shadow: 0 12px 34px rgba(0,0,0,.25); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); opacity: 0; transform: translate(-50%, 10px); transition: .2s ease; pointer-events: none; }
    #toast.show { opacity: 1; transform: translate(-50%, 0); }
    @media (max-width: 440px) { .address { align-items: stretch; flex-direction: column; } .copy { width: 100%; } .actions .button { flex: 1 1 100%; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <div class="ambient" aria-hidden="true"><div class="orb orb-one"></div><div class="orb orb-two"></div><div class="orb orb-three"></div></div>
  <main>
    <section class="card" aria-labelledby="title">
      <div class="eyebrow"><span class="spark" aria-hidden="true"></span> iOS PACKAGE SOURCE</div>
      <h1 id="title">ㅤㅤㅤㅤㅤㅤㅤㅤ于你有源</h1>
      <p class="intro">欢迎来到我的软件源。通过 Sileo 添加源地址，发现并管理适用于你的越狱环境的软件包。</p>
      <div class="actions">
        <a class="button button-primary" href="sileo://source/https://ynyy0.github.io/" aria-label="在 Sileo 中添加于你有源"><span aria-hidden="true">＋</span> 添加到 Sileo</a>
        <a class="button" href="https://qm.qq.com/q/r781ixQ16q" target="_blank" rel="noopener noreferrer">加入交流群 <span aria-hidden="true">↗</span></a>
      </div>
      <p class="address-label">软件源地址</p>
      <div class="address">
        <code id="source-url">https://ynyy0.github.io/</code>
        <button class="button copy" id="copy-button" type="button">复制地址</button>
      </div>
      <p class="note">在兼容的软件包管理器中添加此地址即可。软件包是否可用，取决于源中已发布的兼容软件包。</p>
    </section>
    <footer>ㅤㅤㅤㅤㅤㅤㅤㅤ于你有源 · 个人软件源</footer>
  </main>
  <div id="toast" role="status" aria-live="polite"></div>
  <script>
    const button = document.getElementById('copy-button');
    const toast = document.getElementById('toast');
    let toastTimer;
    button.addEventListener('click', async () => {
      const url = document.getElementById('source-url').textContent;
      try {
        await navigator.clipboard.writeText(url);
        toast.textContent = '源地址已复制';
      } catch {
        const field = document.createElement('textarea');
        field.value = url;
        field.style.position = 'fixed';
        field.style.opacity = '0';
        document.body.appendChild(field);
        field.select();
        const copied = document.execCommand('copy');
        field.remove();
        toast.textContent = copied ? '源地址已复制' : '请长按地址手动复制';
      }
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
    });
  </script>
</body>
</html>
